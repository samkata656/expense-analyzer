# Production stack for Portainer (Stacks → Add stack → Repository, compose path: docker-compose.yml).
# Images are built by GitHub Actions and pulled from GHCR. Set the variables from .env.example in Portainer.
name: expense-analyzer

x-n8n-db: &n8n-db
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}

services:
  postgres:
    image: ghcr.io/${GHCR_OWNER:-samkata656}/expense-analyzer-db:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      CFO_DB_PASSWORD: ${CFO_DB_PASSWORD:?set CFO_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expenses"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  n8n:
    image: ghcr.io/${GHCR_OWNER:-samkata656}/expense-analyzer-n8n:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *n8n-db
      N8N_HOST: ${N8N_HOST:?set N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Sofia}
      TZ: ${GENERIC_TIMEZONE:-Europe/Sofia}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # bootstrap: credentials + workflows imported on every start (see n8n/bootstrap)
      N8N_AUTO_IMPORT: ${N8N_AUTO_IMPORT:-true}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      CFO_DB_PASSWORD: ${CFO_DB_PASSWORD}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [backend]

  web:
    image: ghcr.io/${GHCR_OWNER:-samkata656}/expense-analyzer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD}@postgres:5432/expenses
      N8N_INTAKE_WEBHOOK_URL: http://n8n:5678/webhook/expense-intake
      N8N_CFO_WEBHOOK_URL: http://n8n:5678/webhook/cfo-chat
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
    volumes:
      - uploads:/data/uploads
    networks: [backend]

  proxy:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # admin UI: close in the DigitalOcean firewall once set up
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks: [backend]

volumes:
  pgdata:
  n8n_data:
  uploads:
  npm_data:
  npm_letsencrypt:

networks:
  backend:
