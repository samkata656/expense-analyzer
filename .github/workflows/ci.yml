name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (unit + API + n8n policy + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Postgres (pgvector + roles) and n8n images as production, built from this commit.
      # n8n also imports the TEST ONLY policy harness. No OpenAI key is used anywhere in CI.
      - name: Start Postgres + n8n
        working-directory: .
        run: docker compose -f docker-compose.dev.yml up -d --build --wait postgres n8n

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

      - name: Unit + API integration tests (Vitest, real Postgres, stubbed n8n)
        run: npm test

      - name: Wait for n8n workflows
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"cases":[]}' http://localhost:5678/webhook/policy-test || true)
            [ "$code" != "000" ] && [ "$code" != "404" ] && echo "n8n ready ($code)" && exit 0
            sleep 3
          done
          docker compose -f docker-compose.dev.yml logs n8n | tail -50
          exit 1

      - name: Policy rules in the real n8n workflow (30 cases)
        working-directory: .
        run: node --test tests/policy.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, desktop + Pixel 7)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: n8n logs on failure
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.dev.yml logs n8n | tail -200

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: db, context: db, file: db/Dockerfile }
          - { name: n8n, context: n8n, file: n8n/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
