name: Publish images

# Pushes ghcr.io/<owner>/expense-analyzer-{web,db,n8n} to GHCR:
#   - after CI succeeds on a push to main:      :latest and :sha-<short>
#   - when a release tag vX.Y.Z is pushed:       :X.Y.Z and :X.Y   (only if CI passed on that commit)
# Create a release with:  gh release create v1.0.0 --generate-notes   (or GitHub → Releases → Draft a new release)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: db, context: db, file: db/Dockerfile }
          - { name: n8n, context: n8n, file: n8n/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # For workflow_run, GITHUB_SHA is the tip of main, not the tested commit: tag from the checked-out SHA.
      - id: sha
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          full=$(git rev-parse HEAD); short=$(git rev-parse --short=7 HEAD)
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "short=$short" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; else version="sha-$short"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release tag must point at a commit that already passed CI.
      - name: Require green CI for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.full }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --status success --limit 1 --json databaseId --jq 'length')
          [ "$ok" = "1" ] || { echo "::error::CI has not passed on $SHA. Tag a commit from main that has a green CI run."; exit 1; }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/expense-analyzer-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.full }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.sha.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
