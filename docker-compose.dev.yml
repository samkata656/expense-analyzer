# Local development: Postgres + n8n in Docker, Next.js via `npm run dev` on the host
# (or add `--profile web` to also run the production web image locally).
#   docker compose -f docker-compose.dev.yml up -d --build
# Defaults match apps/web/.env.example. The root .env.example is for production only.
name: expense-analyzer-dev

services:
  postgres:
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      CFO_DB_PASSWORD: ${CFO_DB_PASSWORD:-cfo}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
    ports:
      - "${DEV_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    build: ./n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-only-encryption-key}
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Sofia
      TZ: Europe/Sofia
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_AUTO_IMPORT: ${N8N_AUTO_IMPORT:-true}
      N8N_IMPORT_TEST_WORKFLOWS: "true"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      CFO_DB_PASSWORD: ${CFO_DB_PASSWORD:-cfo}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev-webhook-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_rw:${APP_DB_PASSWORD:-app}@postgres:5432/expenses
      N8N_INTAKE_WEBHOOK_URL: http://n8n:5678/webhook/expense-intake
      N8N_CFO_WEBHOOK_URL: http://n8n:5678/webhook/cfo-chat
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev-webhook-secret}
      PUBLIC_BASE_URL: http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  n8n_data:
  uploads:
